version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dhatree_db_dev
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dhatree_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-dhatree_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dhatree_secret_password}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dhatree_user} -d ${POSTGRES_DB:-dhatree_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dhatree_redis_dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dhatree_backend_dev
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-dhatree_user}:${POSTGRES_PASSWORD:-dhatree_secret_password}@postgres:5432/${POSTGRES_DB:-dhatree_ai_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dhatree_celery_worker_dev
    restart: always
    command: celery -A config worker -l info
    volumes:
      - ../backend:/app/backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-dhatree_user}:${POSTGRES_PASSWORD:-dhatree_secret_password}@postgres:5432/${POSTGRES_DB:-dhatree_ai_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    container_name: dhatree_frontend_dev
    restart: always
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ../frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  redis_dev_data:
