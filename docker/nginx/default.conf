# ==============================================================================
# Dhatree AI Production Nginx Configuration
# Reverse proxies requests to Django API (/api, /admin) and serves static Vite frontend
# ==============================================================================

upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Client upload size limit (important for disease detection image uploads)
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve built React SPA static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Django API Reverse Proxy
    location /api/ {
        proxy_pass http://django_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin Reverse Proxy
    location /admin/ {
        proxy_pass http://django_backend/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Static Files
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        access_log off;
    }

    # Django User Uploaded Media Files
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        access_log off;
    }
}
