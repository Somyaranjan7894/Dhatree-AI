# ==============================================================================
# Dhatree AI Pre-commit Configuration
# Enforces strict code quality, formatting, and type checks before commit
# ==============================================================================

repos:
  # General pre-commit hooks (trailing whitespace, EOF line, YAML syntax check)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: detect-private-key

  # Black - Python Code Formatter (PEP8 compliant)
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.13
        args: ["--line-length=88"]
        files: ^backend/.*\.py$

  # isort - Python Import Sorter
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "88"]
        files: ^backend/.*\.py$

  # flake8 - Python Linter
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: ["--config=backend/setup.cfg"]
        files: ^backend/.*\.py$

  # Prettier - Frontend Code Formatter (TS, TSX, CSS, HTML, JSON, MD)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^(frontend/src/|frontend/index\.html|docs/|.*\.md$|.*\.json$)
        types_or: [javascript, jsx, ts, tsx, css, html, json, markdown]

  # ESLint - Frontend Linter (TypeScript / React)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: ^frontend/src/.*\.(ts|tsx)$
        additional_dependencies:
          - eslint
          - typescript
          - "@typescript-eslint/eslint-plugin"
          - "@typescript-eslint/parser"
