name: Dhatree AI Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dhatree_ai_test_db
          POSTGRES_USER: dhatree_test_user
          POSTGRES_PASSWORD: dhatree_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements/*.txt

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run Black Formatting Check
        working-directory: ./backend
        run: |
          black --check .

      - name: Run isort Import Check
        working-directory: ./backend
        run: |
          isort --check-only .

      - name: Run flake8 Linter
        working-directory: ./backend
        run: |
          flake8 .

      - name: Run Pytest with Django and PostgreSQL
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://dhatree_test_user:dhatree_test_password@localhost:5432/dhatree_ai_test_db
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: test-secret-key-for-ci
        run: |
          pytest --maxfail=1 --disable-warnings -v
